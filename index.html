    <script>
      // Fix for extensions attempting to assign window.fetch when only getter exists
      (function() {
        try {
          var originalFetch = window.fetch ? window.fetch.bind(window) : null;
          Object.defineProperty(window, 'fetch', {
            configurable: true,
            enumerable: true,
            get: function() {
              return originalFetch;
            },
            set: function(newFetch) {
              originalFetch = newFetch;
            }
          });
        } catch (e) {
          // Ignore if environment forbids redefinition
        }
      })();
    </script>
